# Local development infrastructure only. Never used in production.
name: fingerpay

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${PG_SUPERUSER_PASSWORD:-postgres-dev-only}
      POSTGRES_DB: fingerpay
      # Consumed by db/dev/00-bootstrap.sh to set dev role passwords.
      FP_OWNER_PASSWORD: ${FP_OWNER_PASSWORD:-owner-dev-only-password}
      FP_APP_PASSWORD: ${FP_APP_PASSWORD:-app-dev-only-password}
      FP_WORKER_PASSWORD: ${FP_WORKER_PASSWORD:-worker-dev-only-password}
      FP_ADMIN_PASSWORD: ${FP_ADMIN_PASSWORD:-admin-dev-only-password}
      FP_READONLY_PASSWORD: ${FP_READONLY_PASSWORD:-readonly-dev-only-password}
    ports:
      - '127.0.0.1:5432:5432' # loopback only
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/db/bootstrap:/fp-bootstrap:ro
      - ./backend/db/dev/00-bootstrap.sh:/docker-entrypoint-initdb.d/00-bootstrap.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d fingerpay']
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
