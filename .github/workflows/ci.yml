name: ci
on:
  push:
  pull_request:
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }  # gitleaks scans the full history
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run test:db
      - run: npm run build
      - run: npx astryx doctor --built .
      - run: npm audit --omit=dev --audit-level=high
      - run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.28.0 git /repo --config /repo/.gitleaks.toml --redact --no-banner

  integration:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npx supabase start
      - run: npm run dev:setup
      - name: seed twice (must be repeatable)
        run: npm run seed:demo && npm run seed:demo
      - run: npm run build
      - name: start the app
        run: |
          npm start &
          for i in $(seq 1 60); do curl -fs http://127.0.0.1:3000/api/v1/system/health && exit 0; sleep 1; done; exit 1
      - run: npm run test:http
